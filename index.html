<!DOCTYPE html>
<html lang="en">
<head>
    <title>Greenfield Local Hub</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Accessibility and Design Enhancements */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #f9f9f9; /* Beige background */
        }

        .sidebar {
            width: 200px;
            background: #eee;
            padding: 20px;
            height: 100vh;
        }

        .sidebar p {
            margin: 15px 0;
            cursor: pointer;
            color: #006400; /* Green text */
        }

        .sidebar p:hover {
            color: #ff69b4; /* Pink hover effect */
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        .product-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Fill the page more */
        }

        .card {
            background: #ddd;
            padding: 15px;
            width: 150px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .card:hover {
            background: #ffebcd; /* Light beige hover effect */
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #eee;
            text-align: center;
            padding: 10px;
        }

        .hidden {
            display: none;
        }

        .dashboard {
            background: #f0fff0; /* Light green background */
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <p onclick="show('home')">Home</p>
        <p onclick="show('products')">Product</p>
        <p onclick="show('dashboard')">Dashboard</p>
        <p onclick="show('login')">Login</p> <!-- Added Login link -->
        <p onclick="show('cart')">Cart</p> <!-- Added Cart link -->
    </div>

    <div class="main">

        <!-- Home Section -->
        <div id="home">
            <h1>Welcome To Greenfield Local Hub</h1>
            <p>Buy fresh local food and support local farmers</p>
            <button onclick="show('products')">Browse Products</button>
        </div>

        <!-- Products Section -->
        <div id="products" class="hidden">
            <h3>Product List</h3>
            <div id="productList" class="product-grid"></div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="hidden">
            <h1>Producer Dashboard</h1>
            <p>Manage stock levels, update product details, and view orders.</p>
        </div>

        <!-- Login Section -->
        <div id="login" class="hidden">
            <h1>Login</h1>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" onclick="login()">Login</button>
            </form>
            <p id="loginMessage"></p>
        </div>

        <!-- Cart Section -->
        <div id="cart" class="hidden">
            <h1>Your Cart</h1>
            <div id="cartList" class="product-grid"></div>
            <h3>Total: £<span id="cartTotal">0.00</span></h3>
        </div>

    </div>

    <div class="footer">
        Contact Us | Accessibility | Privacy Policy
    </div>

    <script>
        // Existing products array
        let products = [
            { name: "Apples", price: 3.50 },
            { name: "Milk", price: 2.00 },
            { name: "Bananas", price: 2.10 }
        ];

        let cart = []; // Cart array
        let loggedInUser = null; // Logged-in user

        // Page switch function
        function show(page) {
            document.querySelectorAll('.main > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(page).classList.remove('hidden');

            if (page === "products") {
                displayProducts(products);
            } else if (page === "cart") {
                displayCart();
            }
        }

        // Display products
        function displayProducts(list) {
            let output = "";
            list.forEach((p, index) => {
                output += `
                <div class="card">
                    <p>${p.name}</p>
                    <p>Price: £${p.price.toFixed(2)}</p>
                    <button onclick="addToCart(${index})">Add to Cart</button>
                </div>
                `;
            });
            document.getElementById("productList").innerHTML = output;
        }

        // Add product to cart
        function addToCart(index) {
            cart.push(products[index]);
            alert(`${products[index].name} added to cart!`);
        }

        // Display cart
        function displayCart() {
            let output = "";
            let total = 0;
            cart.forEach((item, index) => {
                output += `
                <div class="card">
                    <p>${item.name}</p>
                    <p>Price: £${item.price.toFixed(2)}</p>
                    <button onclick="removeFromCart(${index})">Remove</button>
                </div>
                `;
                total += item.price;
            });
            document.getElementById("cartList").innerHTML = output;
            document.getElementById("cartTotal").innerText = total.toFixed(2);
        }

        // Remove product from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            displayCart();
        }

        // Login function
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username && password) {
                loggedInUser = username;
                document.getElementById("loginMessage").innerText = `Welcome, ${username}!`;
                document.getElementById("loginForm").reset();
            } else {
                alert("Please enter both username and password.");
            }
        }
    </script>

</body>
    
    </body>
    </html>
